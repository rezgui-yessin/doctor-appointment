# === Server ===
server.port=8083

# === Datasource (PostgreSQL) ===
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/doctor_appointment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# === Flyway ===
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# === JWT ===
jwt.secret=${JWT_SECRET:c29tZS1zdXBlci1zZWNyZXQta2V5LWZvci1kb2N0b3ItYXBwb2ludG1lbnQtc3lzdGVtLWNoYW5nZS1tZQ==}
jwt.expiration-ms=86400000

# === Swagger ===
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# === Email Configuration ===
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:user}
spring.mail.password=${MAIL_PASSWORD:pass}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# === AI Configuration ===
openai.api.key=${OPENAI_API_KEY:dummy}

# === File Upload ===
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=uploads

# === Static Resources ===
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.mvc.static-path-pattern=/uploads/**

# === Cloudinary Configuration ===
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:djalg6hkt}
cloudinary.api-key=${CLOUDINARY_API_KEY:675896959317332}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:9fxNxXuQUOUprJDZNZx0HWyboAQ}
