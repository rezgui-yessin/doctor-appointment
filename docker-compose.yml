services:
  postgres:
    image: postgres:16-alpine
    container_name: doctor-appointment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: doctor_appointment_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - doctor-net

  backend:
    build: 
      context: ./doctor-appointment-system
      dockerfile: Dockerfile
    container_name: doctor-appointment-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/doctor_appointment_db
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - JWT_SECRET=${JWT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    networks:
      - doctor-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doctor-appointment-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - doctor-net

volumes:
  postgres_data:

networks:
  doctor-net:
    driver: bridge
