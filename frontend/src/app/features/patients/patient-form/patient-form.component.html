<div class="page-shell narrow">
  <header class="page-head">
    <span class="eyebrow">Your Record</span>
    <h1>Edit Profile</h1>
    <p class="sub">Keep your information current so doctors and reminder emails reach the right place.</p>
  </header>

  <app-spinner *ngIf="loading()" label="Loading your profile…"></app-spinner>

  <form class="card form-card" *ngIf="!loading()" [formGroup]="form" (ngSubmit)="submit()">

    <!-- ── Photo Upload Section ── -->
    <div class="photo-section">
      <div class="avatar-wrapper">
        <div class="avatar-display" [class.has-photo]="photoPreview()">
          <img *ngIf="photoPreview()" [src]="photoPreview()" alt="Profile photo" class="avatar-img" />
          <span *ngIf="!photoPreview()" class="avatar-initials">{{ initials || '?' }}</span>
          <div class="avatar-overlay" (click)="fileInput.click()">
            <span class="overlay-icon">📷</span>
            <span class="overlay-text">Change</span>
          </div>
        </div>
        <div class="avatar-actions">
          <button type="button" class="btn btn-ghost btn-sm" (click)="fileInput.click()" [disabled]="uploading()">
            <span *ngIf="uploading()">⏳ Uploading…</span>
            <span *ngIf="!uploading()">📤 Upload Photo</span>
          </button>
          <button type="button" class="btn btn-ghost btn-sm btn-danger-ghost" *ngIf="photoPreview()" (click)="removePhoto()">
            🗑 Remove
          </button>
        </div>
        <input #fileInput type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden (change)="onFileSelected($event)" />
      </div>
      <div class="photo-hint">
        <p>Accepted formats: JPG, PNG, WebP, GIF • Max 5 MB</p>
      </div>
    </div>

    <div class="form-divider"></div>

    <!-- ── Full Name ── -->
    <div class="field">
      <label for="fullName">Full Name *</label>
      <input id="fullName" formControlName="fullName" placeholder="e.g. Jordan Blake"
             [class.invalid]="form.controls.fullName.invalid && form.controls.fullName.touched">
      <span class="error" *ngIf="form.controls.fullName.invalid && form.controls.fullName.touched">Enter your full name (min 2 characters).</span>
    </div>

    <!-- ── Email + Phone ── -->
    <div class="two-col">
      <div class="field">
        <label for="email">Email Address</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com"
               [class.invalid]="form.controls.email.invalid && form.controls.email.touched">
        <span class="error" *ngIf="form.controls.email.invalid && form.controls.email.touched">Enter a valid email.</span>
      </div>
      <div class="field">
        <label for="phone">Phone Number</label>
        <input id="phone" formControlName="phone" placeholder="+1 555 0100">
      </div>
    </div>

    <!-- ── Date of Birth ── -->
    <div class="field">
      <label for="dob">Date of Birth</label>
      <input id="dob" type="date" formControlName="dateOfBirth">
    </div>

    <!-- ── Actions ── -->
    <div class="form-actions">
      <span class="unsaved-indicator" *ngIf="form.dirty">● Unsaved changes</span>
      <button type="submit" class="btn btn-accent" [disabled]="saving() || uploading()">
        <span *ngIf="saving()">💾 Saving…</span>
        <span *ngIf="!saving()">✅ Save Profile</span>
      </button>
    </div>
  </form>
</div>
