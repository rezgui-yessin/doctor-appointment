<nav class="ledger-nav" *ngIf="auth.isAuthenticated()">
  <div class="brand">
    <span class="brand-mark">CW</span>
    <span class="brand-name">Chartwell</span>
  </div>

  <div class="tabs">
    <a routerLink="/dashboard" routerLinkActive="active" class="tab">Dashboard</a>
    <a routerLink="/doctors" routerLinkActive="active" class="tab">Doctors</a>
    <a *ngIf="auth.role() === 'PATIENT'" routerLink="/book" routerLinkActive="active" class="tab">Book visit</a>
    <a routerLink="/appointments" routerLinkActive="active" class="tab">Appointments</a>
    <a *ngIf="auth.role() === 'PATIENT'" routerLink="/my-profile" routerLinkActive="active" class="tab">My profile</a>
  </div>

  <div class="account">
    <span class="role-chip">{{ auth.role() }}</span>
    <span class="email">{{ auth.email() }}</span>
    <button class="btn btn-ghost btn-sm" (click)="logout()">Sign out</button>
  </div>
</nav>
